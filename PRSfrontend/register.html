<html>
    <head>
        <title> REGISTRATION </title>
        <style>
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: linear-gradient(135deg, #eef2f7, #dbeafe);
        margin: 0;
        padding: 0;
    }

    .main-title {
        text-align: center;
        font-size: 36px;
        font-weight: 700;
        margin-top: 50px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        background: linear-gradient(90deg, #1e3a8a, #2563eb);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    form {
        width: 420px;
        margin: 40px auto;
        background: #ffffff;
        padding: 35px 40px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    }

    label {
        font-weight: 600;
        color: #374151;
        font-size: 14px;
    }

    input, select {
        width: 100%;
        padding: 10px 12px;
        margin-top: 6px;
        border-radius: 6px;
        border: 1px solid #cbd5e1;
        font-size: 14px;
        transition: all 0.3s ease;
        box-sizing: border-box;
    }

    input:focus, select:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 6px rgba(37, 99, 235, 0.3);
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 20px;
        background: linear-gradient(90deg, #2563eb, #1e40af);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    button:hover {
        background: linear-gradient(90deg, #1e40af, #1e3a8a);
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
    }
</style>
    </head>
  <body>
       <h1 class="main-title">
     <span class="icon">🏥</span>
         PATIENT REGISTRATION SYSTEM
</h1>

       <form action="http://localhost:8080/doctors/register" method="post">
          <label for="name">Patient Name:</label><br>
          <input type="text" name="name"><br><br>

           <label for="age">Patient Age:</label><br>
          <input type="number" name="age"><br><br>

          <label for="gender">Choose a Gender</label>
          <select name="gender" name="gender">
            <option value="male">Male</option>      
            <option value="female">Female</option>
            <option value="other">Other</option>
          </select>
          <br><br>

           <label for="contact">Contact Number:</label><br>
          <input type="tel" name="contactno"><br><br>

          <label for="name">Address:</label><br>
          <input type="text" name="address"><br><br>

          <label for="name">Symptoms:</label><br>
          <input type="text" name="symptoms"><br><br>

            <button type="submit">Submit</button>
                        




       </form>
  </body>
</html>
